<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Project | Vectorial Collective</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80">
        <nav class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="assets/logo.png" alt="Vectorial Collective Logo" class="w-10 h-10 rounded-xl object-contain bg-black border border-blue-500/30 p-1 group-hover:scale-105 transition-transform">
                <div class="flex flex-col">
                    <span class="text-base font-extrabold tracking-wider bg-gradient-to-r from-blue-400 via-sky-300 to-white bg-clip-text text-transparent">VECTORIAL</span>
                    <span class="text-[10px] tracking-widest text-slate-400 font-mono -mt-1 uppercase">Collective</span>
                </div>
            </a>

            <div class="hidden md:flex items-center gap-7 text-sm font-medium text-slate-300">
                <a href="projects.html" class="hover:text-blue-400 transition-colors">Projects</a>
                <a href="submit.html" class="text-blue-400 font-semibold">Submit a Project</a>
                <a href="dashboard.html" class="hover:text-blue-400 transition-colors">Dashboard</a>
                <a href="index.html#demo" class="hover:text-blue-400 transition-colors">Live Sim</a>
            </div>

            <div id="nav-actions" class="flex items-center gap-3">
                <span id="operator-badge" class="text-xs font-mono text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl hidden">Operator</span>
            </div>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-12 flex-1 w-full">
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-8 backdrop-blur shadow-2xl">
            <div class="mb-8 pb-4 border-b border-slate-800">
                <span class="text-xs font-mono text-blue-400 uppercase tracking-widest">Submission Portal</span>
                <h1 class="text-2xl font-bold text-white mt-1">Publish New Project</h1>
                <p class="text-xs text-slate-400 mt-1 font-mono">Register your simulation kernel or repository with the collective.</p>
            </div>

            <form id="submit-form" onsubmit="handleProjectSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-mono text-slate-300 mb-2">Project Title</label>
                    <input type="text" id="project-title" required placeholder="e.g. Escape Velocity Calculator" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-blue-500 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs font-mono text-slate-300 mb-2">Repository URL</label>
                    <input type="url" id="project-url" required placeholder="https://github.com/vectorial-collective/your-repo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-blue-500 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs font-mono text-slate-300 mb-2">Project Description</label>
                    <textarea id="project-desc" rows="3" required placeholder="Briefly describe your simulation kernel or math model..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-blue-500 outline-none transition-all resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs font-mono transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Publish to Collective Registry</span>
                </button>
            </form>
        </div>
    </main>

    <footer class="max-w-6xl mx-auto px-6 py-8 border-t border-slate-800/80 text-slate-500 text-xs w-full flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="assets/logo.png" alt="Logo" class="w-6 h-6 rounded-lg object-contain bg-black border border-blue-500/30 p-0.5">
            <span class="text-slate-400 font-semibold">Vectorial Collective</span>
        </div>
        <span class="font-mono text-[11px]">Copyright &copy; Vectorial Collective 2026</span>
    </footer>

    <!-- Submission Script -->
    <script>
        const { createClient } = supabase;
        const _supabase = createClient('https://aqrcbiwsnkgrgjdxbpes.supabase.co', 'sb_publishable_QXW8wZWU9NAJukzkhmoYiQ_GiunATxY');

        let activeUser = null;

        async function verifySession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                // If not signed in, redirect smoothly back to index with anchor or alert
                window.location.href = 'index.html';
                return;
            }
            activeUser = session.user;
            const handle = activeUser.user_metadata.preferred_username || activeUser.user_metadata.user_name || 'Operator';
            const badge = document.getElementById('operator-badge');
            badge.innerText = `@${handle}`;
            badge.classList.remove('hidden');
        }

        async function handleProjectSubmit(event) {
            event.preventDefault();
            if (!activeUser) {
                alert('Please sign in with GitHub first.');
                return;
            }

            const title = document.getElementById('project-title').value.trim();
            const repo_url = document.getElementById('project-url').value.trim();
            const description = document.getElementById('project-desc').value.trim();
            const handle = activeUser.user_metadata.preferred_username || activeUser.user_metadata.user_name || 'Operator';

            try {
                // Insert into Supabase projects table
                const { error: projError } = await _supabase.from('projects').insert([
                    { title: title, repo_url: repo_url, description: description, owner_id: activeUser.id }
                ]);

                if (projError) throw projError;

                // Log activity to telemetry feed
                await _supabase.from('activity_logs').insert([
                    { action: `@${handle} published new project: ${title}`, user_id: activeUser.id }
                ]);

                alert('Project successfully published to the collective registry!');
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error('Submission error:', err);
                alert('Error publishing project. Ensure your Supabase tables are configured correctly.');
            }
        }

        verifySession();
    </script>
</body>
</html>
